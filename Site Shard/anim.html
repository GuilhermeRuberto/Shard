<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shard ERP - Teste de Movimento 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1d24;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .info {
            position: absolute;
            bottom: 20px;
            color: #888;
            font-size: 14px;
            pointer-events: none;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>
    <div class="info">SE LEU MAMOU KKKKKK</div>

    <!-- Motor Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Configuração da Cena
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1d24);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 2. Iluminação de Estúdio
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 15, 10);
        scene.add(dirLight);

        // 3. Criação de um Grupo com formas geométricas (substituto visual provisório)
        const logoGroup = new THREE.Group();
        scene.add(logoGroup);

        const materialPrata = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.8, roughness: 0.2 });
        const materialRoxo = new THREE.MeshStandardMaterial({ color: 0x8b5cf6, metalness: 0.6, roughness: 0.3 });

        // Bloco central simulando o corpo principal
        const boxGeo = new THREE.BoxGeometry(4, 1.2, 0.6);
        const centralMesh = new THREE.Mesh(boxGeo, materialPrata);
        logoGroup.add(centralMesh);

        // Geometrias laterais simulando o elemento do Penrose/detalhes
        const sideGeo = new THREE.BoxGeometry(1.2, 1.2, 0.8);
        const leftMesh = new THREE.Mesh(sideGeo, materialRoxo);
        leftMesh.position.set(-3.0, 0, 0.2);
        logoGroup.add(leftMesh);

        const rightMesh = new THREE.Mesh(sideGeo, materialRoxo);
        rightMesh.position.set(3.0, 0, 0.2);
        logoGroup.add(rightMesh);

        // 4. Captura de Movimento do Mouse
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        const clock = new THREE.Clock();

        // 5. Loop de Animação com Lerp e Clamp Rigoroso
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Flutuação vertical orgânica contínua
            logoGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.1;

            // Alvo de rotação baseado na posição do mouse combinada com oscilação leve
            let targetRotY = mouseX * 0.25 + Math.sin(elapsedTime * 0.8) * 0.05;
            let targetRotX = mouseY * 0.18 + Math.cos(elapsedTime * 0.8) * 0.03;

            // TRAVA DE SEGURANÇA (CLAMP): Impede que o bloco vire de costas ou exceda os limites desejados
            targetRotY = Math.max(-0.25, Math.min(0.25, targetRotY));
            targetRotX = Math.max(-0.15, Math.min(0.15, targetRotX));

            // Suavização do movimento (Lerp de interpolação)
            logoGroup.rotation.y += (targetRotY - logoGroup.rotation.y) * 0.08;
            logoGroup.rotation.x += (targetRotX - logoGroup.rotation.x) * 0.08;

            renderer.render(scene, camera);
        }

        animate();

        // Responsividade da tela
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
